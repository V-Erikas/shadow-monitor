services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./snapshots:/app/snapshots
    command: >
      sh -c "python -m shadow.pipeline --skip-if-exists;
             exec streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
             --server.headless=true --browser.gatherUsageStats=false"
